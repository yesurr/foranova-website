<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FORANOVA | Premium Men's Essentials</title>

<meta name="description" content="Premium men's essentials crafted from natural fibers.">

<meta property="og:title" content="FORANOVA">
<meta property="og:description" content="Premium men's essentials crafted from natural fibers.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
-webkit-font-smoothing:antialiased;
-moz-osx-font-smoothing:grayscale;
}

body{

background:#ffffff;
color:#111111;

font-family:'Inter',sans-serif;

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;

padding:48px;

}

.container{

width:100%;
max-width:620px;

text-align:center;

animation:fade .9s ease;

}

.brand{

font-family:'EB Garamond',serif;

font-size:5rem;

font-weight:600;

letter-spacing:.22em;

margin-bottom:3rem;

}

.tagline{

font-size:1.9rem;

font-weight:400;

line-height:1.45;

margin-bottom:3rem;

}

.copy{

font-size:1.08rem;

font-weight:300;

line-height:2;

color:#555;

max-width:520px;

margin:0 auto;

}

.copy p{

margin-bottom:1.4rem;

}

.contact{

margin-top:4.5rem;

}

.contact a{

color:#111;

text-decoration:none;

font-size:1rem;

letter-spacing:.04em;

border-bottom:1px solid transparent;

transition:.25s;

}

.contact a:hover{

border-color:#111;

}

footer{

margin-top:5rem;

font-size:.72rem;

letter-spacing:.28em;

text-transform:uppercase;

color:#999;

}

@keyframes fade{

from{

opacity:0;
transform:translateY(18px);

}

to{

opacity:1;
transform:translateY(0);

}

}

@media (max-width:768px){

body{

padding:32px;

}

.brand{

font-size:3.4rem;

letter-spacing:.16em;

margin-bottom:2.2rem;

}

.tagline{

font-size:1.45rem;

margin-bottom:2.2rem;

}

.copy{

font-size:1rem;

line-height:1.9;

}

}

</style>

</head>

<body>

<div class="container">

<h1 class="brand">
FORANOVA
</h1>

<h2 class="tagline">
Premium men's essentials<br>
crafted from natural fibers.
</h2>

<div class="copy">

<p>
Designed with an uncompromising focus on comfort, quality and timeless design.
</p>

<p>
Our first collection is currently in development.
</p>

</div>

<div class="contact">

<a href="mailto:hello@foranova.com">
@foranova.com
</a>

</div>

<footer>

© 2026 FORANOVA

</footer>

</div>

</body>
</html>
