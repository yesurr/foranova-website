<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d7d0c3">
  <meta name="description" content="FORANOVA creates premium men's essentials with a focus on natural materials, comfort and timeless design.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://foranova.com/">
  <title>FORANOVA — Premium Men's Essentials</title>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="FORANOVA">
  <meta property="og:title" content="FORANOVA — Premium Men's Essentials">
  <meta property="og:description" content="Premium men's essentials with a focus on natural materials, comfort and timeless design.">
  <meta property="og:url" content="https://foranova.com/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="FORANOVA — Premium Men's Essentials">
  <meta name="twitter:description" content="Premium men's essentials with a focus on natural materials, comfort and timeless design.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      min-height: 100vh;
      margin: 0;
      background: #d7d0c3 url("hero-bg.jpg.png") center / cover no-repeat fixed;
      color: #1f1d1a;
      font-family: Inter, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      position: relative;
      display: grid;
      min-height: 100vh;
      grid-template-rows: 1fr auto;
      padding: clamp(1.25rem, 3vw, 2.5rem);
      overflow: hidden;
    }
    .page::before {
      position: absolute;
      z-index: 0;
      inset: 0;
      content: "";
      background: linear-gradient(180deg, rgba(255,255,255,.04), transparent 55%, rgba(255,255,255,.12));
      pointer-events: none;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .contact {
      position: relative;
      z-index: 1;
      justify-self: center;
      margin-bottom: clamp(.2rem, 1vw, .75rem);
      padding: .55rem 0;
      border-bottom: 1px solid rgba(31,29,26,.72);
      color: #1f1d1a;
      font-size: clamp(.62rem, 1.2vw, .72rem);
      font-weight: 500;
      letter-spacing: .2em;
      text-decoration: none;
      text-transform: uppercase;
      transition: opacity 180ms ease, transform 180ms ease;
    }
    .contact:hover, .contact:focus-visible { opacity: .58; transform: translateY(-1px); }
    .contact:focus-visible { outline: 2px solid #1f1d1a; outline-offset: 6px; }
    @media (max-width: 42rem) {
      body { background-attachment: scroll; background-position: center; }
      .page { padding: 1.25rem; }
      .contact { margin-bottom: .25rem; letter-spacing: .14em; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="sr-only">FORANOVA — Premium men's essentials crafted from natural fibers</h1>
    <a class="contact" href="mailto:hello@foranova.com">hello@foranova.com</a>
  </main>
</body>
</html>
