<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FORANOVA | Premium Men's Essentials</title>
<meta name="description" content="Premium men's essentials crafted from natural fibers.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
height:100%;
}

body{

height:100%;

font-family:'Inter',sans-serif;

color:#1b1b1b;

background:
linear-gradient(rgba(255,255,255,.72),rgba(255,255,255,.72)),
url("linen.jpg");

background-size:cover;
background-position:center;
background-repeat:no-repeat;

display:flex;
justify-content:center;
align-items:center;

padding:40px;

}

.container{

width:100%;
max-width:720px;

text-align:center;

backdrop-filter:blur(2px);

animation:fade .8s ease;

}

.logo{

font-family:'Cormorant Garamond',serif;

font-size:88px;

letter-spacing:.22em;

font-weight:600;

margin-bottom:28px;

}

.line{

width:1px;
height:70px;

background:#b9b9b9;

margin:0 auto 40px auto;

}

h2{

font-size:30px;

font-weight:500;

letter-spacing:.18em;

text-transform:uppercase;

line-height:1.6;

margin-bottom:55px;

}

.description{

max-width:520px;

margin:auto;

font-size:20px;

font-weight:300;

line-height:1.9;

color:#565656;

}

.description p{

margin-bottom:24px;

}

.development{

font-family:'Cormorant Garamond',serif;

font-size:34px;

font-style:italic;

margin-top:12px;

color:#444;

}

.email{

margin-top:70px;

}

.email a{

font-size:18px;

letter-spacing:.18em;

text-decoration:none;

color:#111;

padding-bottom:4px;

border-bottom:1px solid #111;

transition:.25s;

}

.email a:hover{

opacity:.55;

}

footer{

margin-top:90px;

font-size:12px;

letter-spacing:.35em;

color:#888;

text-transform:uppercase;

}

@keyframes fade{

from{
opacity:0;
transform:translateY(16px);
}

to{
opacity:1;
transform:none;
}

}

@media(max-width:768px){

.logo{

font-size:58px;

}

.line{

height:50px;

margin-bottom:28px;

}

h2{

font-size:20px;

}

.description{

font-size:17px;

}

.development{

font-size:26px;

}

.email a{

font-size:15px;

letter-spacing:.12em;

}

}

</style>

</head>

<body>

<div class="container">

<div class="logo">
FORANOVA
</div>

<div class="line"></div>

<h2>
Premium Men's Essentials<br>
Crafted From Natural Fibers.
</h2>

<div class="description">

<p>
Designed with an uncompromising focus on comfort, quality and timeless design.
</p>

<div class="development">
Our first collection is currently in development.
</div>

</div>

<div class="email">

<a href="mailto:@foranova.com">
HELLO@FORANOVA.COM
</a>

</div>

<footer>

© 2026 FORANOVA

</footer>

</div>

</body>
</html>
